services:
  campax-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campax-server
    ports:
      # Host port is configurable so it can't clash with other projects on 8080
      - "${HOST_PORT:-8081}:8080"
    env_file:
      - .env
    environment:
      # Fixed inside the container; overrides anything PORT-related in .env
      PORT: 8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s