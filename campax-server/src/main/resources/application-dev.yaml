server:
  # Bind to all interfaces so mobile devices on the same LAN can reach the API
  address: 0.0.0.0

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campax_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000    # 20 s
      idle-timeout: 300000         # 5 min
      max-lifetime: 1200000        # 20 min

  jpa:
    hibernate:
      ddl-auto: update             # Auto-create/alter tables (dev only!)
    show-sql: true
    properties:
      hibernate:
        format_sql: false           # Pretty-print SQL in the console


# ── JWT ──────────────────────────────────────────────────────────────────────
jwt:
  # Dev-only fallback. Never reuse this value anywhere real.
  secret: ${JWT_SECRET:3S30Jy4F1g5UjkkVWvLuj74n0tWqgYpy0Dx9kNsOSvs}

# ── CORS (Vite default + LAN testing) ────────────────────────────────────────
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173}

# ── Swagger / OpenAPI (dev only) ─────────────────────────────────────────────
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    enabled: true
    path: /api-docs

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.campax: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

# ── Actuator (lightweight health & metrics) ──────────────────────────────────
management:
  endpoint:
    health:
      show-details: when_authorized