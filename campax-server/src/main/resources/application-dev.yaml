server:
  # Bind to all interfaces so mobile devices on the same LAN can reach the API
  address: 0.0.0.0

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campax_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000    # 20 s
      idle-timeout: 300000         # 5 min
      max-lifetime: 1200000        # 20 min

  jpa:
    hibernate:
      ddl-auto: update             # Auto-create/alter tables (dev only!)
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false           # Pretty-print SQL in the console

  # ── Mail (dev) ─────────────────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.sendgrid.net}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:apikey}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# ── JWT ──────────────────────────────────────────────────────────────────────
jwt:
  # ⚠️  CHANGE THIS — use a 256-bit+ Base64 string for real dev work.
  #     Never commit production secrets here.
  secret: ${JWT_SECRET:3S30Jy4F1g5UjkkVWvLuj74n0tWqgYpy0Dx9kNsOSvs}
  refresh-token-expiry: 604800000

# ── Twilio ───────────────────────────────────────────────────────────────────
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  phone-number: ${TWILIO_PHONE_NUMBER:}
  enabled: ${TWILIO_ENABLED:false}

# ── OTP ──────────────────────────────────────────────────────────────────────
otp:
  expiry-minutes: 5
  length: 6

# ── CORS (Vite default + LAN testing) ────────────────────────────────────────
cors:
  allowed-origins: http://localhost:5173,http://localhost:8080,http://127.0.0.1:5173

# ── Swagger / OpenAPI (dev only) ─────────────────────────────────────────────
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    enabled: true
    path: /api-docs

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.campax: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

# ── Actuator (lightweight health & metrics) ──────────────────────────────────
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized