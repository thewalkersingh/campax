server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 100
    connection-timeout: 20000

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?sslMode=${DB_SSL_MODE:REQUIRED}&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 20000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000   # Log leaked connections after 60 s

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}              # 🔴 NEVER use update / create-drop in prod
    show-sql: false
    properties:
      hibernate:
        format_sql: false


# ── JWT ──────────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}

# ── CORS ─────────────────────────────────────────────────────────────────────
cors:
  allowed-origins: ${CORS_ORIGINS}


# ── Swagger / OpenAPI (disabled in prod) ─────────────────────────────────────
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    root: WARN
    com.campax: INFO
    org.springframework.security: WARN
    org.hibernate: WARN