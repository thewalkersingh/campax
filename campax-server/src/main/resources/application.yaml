server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: campax-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}


  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

  jackson:
    # Omit null fields in JSON responses (cleaner API payloads)
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC